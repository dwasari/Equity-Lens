<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EquityLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EEF0EC; --surface:#FFFFFF; --sunk:#E4E7E2;
  --ink:#18202B; --muted:#5B6572; --faint:#8A929C; --rule:#D3D7D0;
  --accent:#23584A; --accent-ink:#FFFFFF; --accent-soft:#D6E4DE;
  --series2:#9AA6A0; --series3:#B98A3E;
  --flag:#8A5A14; --flag-bg:#F5EBD9; --neg:#9B3B2E; --neg-bg:#F6E3DF;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A20; --surface:#1B232B; --sunk:#222B34;
    --ink:#E5E8E3; --muted:#A0A9B3; --faint:#7A848E; --rule:#2E3842;
    --accent:#76B8A2; --accent-ink:#0F1A16; --accent-soft:#24413A;
    --series2:#5E6C68; --series3:#D2A65E;
    --flag:#DDB06A; --flag-bg:#33291A; --neg:#E28E7E; --neg-bg:#3A2420;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#141A20; --surface:#1B232B; --sunk:#222B34;
  --ink:#E5E8E3; --muted:#A0A9B3; --faint:#7A848E; --rule:#2E3842;
  --accent:#76B8A2; --accent-ink:#0F1A16; --accent-soft:#24413A;
  --series2:#5E6C68; --series3:#D2A65E;
  --flag:#DDB06A; --flag-bg:#33291A; --neg:#E28E7E; --neg-bg:#3A2420;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--accent);text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
img,svg{max-width:100%}
button,select,input,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;padding:28px 20px 20px 24px;border-right:1px solid var(--rule);background:var(--paper);overflow-y:auto}
.brand{font-family:var(--serif);font-size:1.6rem;font-weight:500;letter-spacing:-.01em;color:var(--ink);text-decoration:none;line-height:1.1}
.brand-sub{font-size:.8rem;color:var(--muted);margin:6px 0 28px;line-height:1.35}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:block;padding:7px 10px 7px 12px;color:var(--muted);text-decoration:none;font-size:.94rem;border-left:2px solid transparent;margin-left:-12px}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);font-weight:600;border-left-color:var(--accent)}
.nav .group{margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.side-foot{margin-top:auto;padding-top:20px;font-size:.76rem;color:var(--faint);line-height:1.45}
.menu-btn{display:none}
main{min-width:0;padding:44px clamp(20px,5vw,64px) 64px}
main:focus{outline:none}
.page{max-width:1060px}
.site-foot{max-width:1060px;margin-top:72px;padding-top:18px;border-top:1px solid var(--rule);font-size:.82rem;color:var(--muted);line-height:1.55}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:10;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));border-right:0;border-bottom:1px solid var(--rule);overflow:visible}
  .brand{font-size:1.3rem}
  .brand-sub,.side-foot{display:none}
  .menu-btn{display:inline-flex;margin-left:auto;background:none;border:1px solid var(--rule);border-radius:4px;padding:6px 12px;font-size:.88rem;cursor:pointer}
  .nav{display:none;width:100%;padding:10px 0 4px}
  .side.open .nav{display:flex}
  .nav a{margin-left:0}
  main{padding-top:28px}
}

/* ---------- type ---------- */
h1,h2,h3{margin:0;font-weight:500}
.page-title{font-family:var(--serif);font-size:clamp(2rem,4.2vw,2.75rem);line-height:1.08;letter-spacing:-.015em}
.page-intro{font-family:var(--serif);font-size:1.15rem;line-height:1.6;color:var(--muted);max-width:62ch;margin:12px 0 0}
h2.sec{font-family:var(--serif);font-size:1.5rem;line-height:1.2;margin:52px 0 16px}
h3.sub{font-family:var(--sans);font-size:1rem;font-weight:600;margin:0 0 8px}
.prose{font-family:var(--serif);font-size:1.08rem;line-height:1.68;max-width:68ch}
.prose p{margin:0 0 1em}
.small{font-size:.84rem;color:var(--muted)}
.muted{color:var(--muted)}
.neg{color:var(--neg)}

/* ---------- controls ---------- */
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.btn{display:inline-block;padding:10px 18px;border-radius:4px;font-weight:600;font-size:.94rem;text-decoration:none;border:1px solid var(--accent);cursor:pointer;line-height:1.3}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.secondary{background:transparent;color:var(--accent)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--rule)}
.btn.danger{background:transparent;color:var(--neg);border-color:var(--neg)}
.btn.danger.solid{background:var(--neg);color:#fff}
.btn.small{padding:6px 12px;font-size:.86rem}
.btn.primary:hover{filter:brightness(1.08)}
.btn.secondary:hover,.btn.ghost:hover{background:var(--accent-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}
.linkbtn.danger{color:var(--neg)}
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin:20px 0 16px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
select{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:7px 10px;font-size:.92rem;min-width:170px}
.filters input{min-width:220px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--rule);border-radius:999px;background:var(--surface);cursor:pointer;font-size:.9rem}
.chip input{accent-color:var(--accent);margin:0}
.chip:has(input:checked){border-color:var(--accent)}

/* ---------- markers ---------- */
.ph{display:inline-block;font-size:.74rem;font-weight:600;color:var(--flag);background:repeating-linear-gradient(-45deg,var(--flag-bg) 0 6px,transparent 6px 9px);border:1px solid color-mix(in srgb,var(--flag) 45%,transparent);border-radius:3px;padding:1px 7px;white-space:nowrap;vertical-align:middle}
.ph-banner{display:flex;gap:12px;align-items:flex-start;background:var(--flag-bg);border-left:3px solid var(--flag);padding:12px 16px;margin:22px 0 0;font-size:.9rem;line-height:1.5;border-radius:0 4px 4px 0}
@media (max-width:560px){.ph-banner{flex-direction:column;gap:8px}}
.status{display:inline-flex;align-items:center;gap:8px;font-size:.86rem;white-space:nowrap}
.pips{display:inline-flex;gap:2px}
.pips i{width:9px;height:9px;border-radius:1px;background:var(--rule)}
.pips i.on{background:var(--accent)}
.ticker{font-weight:600;letter-spacing:.02em;color:var(--muted);font-size:.86em}
.notice{max-width:1060px;padding:12px 16px;border-radius:0 4px 4px 0;border-left:3px solid var(--accent);background:var(--accent-soft);font-size:.92rem;line-height:1.5;margin:0 0 22px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.page .notice{margin:20px 0 0}
.notice.warn{border-left-color:var(--flag);background:var(--flag-bg)}
.notice.bad{border-left-color:var(--neg);background:var(--neg-bg)}
.notice ul{margin:6px 0 0;padding-left:20px}
.notice .btns{margin:0}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flag{font-size:.76rem;padding:1px 8px;border-radius:3px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.flag.warn{border-color:color-mix(in srgb,var(--flag) 55%,transparent);color:var(--flag);background:var(--flag-bg)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border:1px solid var(--rule);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
thead th{font-weight:500;font-size:.8rem;color:var(--muted);background:var(--sunk);white-space:nowrap}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
tbody th{font-weight:600}
tr.self td,tr.self th{background:var(--accent-soft)}
.row-link{color:var(--ink);text-decoration:none;font-weight:600}
.row-link:hover{color:var(--accent);text-decoration:underline}
.cmp-bar{display:block;height:4px;margin-top:5px;background:var(--rule);border-radius:2px;overflow:hidden}
.cmp-bar span{display:block;height:100%;background:var(--faint)}
.cmp-bar span.n{background:var(--neg)}

/* ---------- panels & charts ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 18px 14px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.panel-head h3{font-size:.98rem;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--sans);font-size:11.5px;fill:var(--muted)}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .zero{stroke:var(--faint);stroke-width:1}
.chart-empty{padding:40px 12px;text-align:center;color:var(--muted);font-size:.9rem}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;align-items:end;padding:20px 0 8px}
.wordmark{font-family:var(--serif);font-weight:500;font-size:clamp(3.2rem,8vw,5.8rem);line-height:.92;letter-spacing:-.035em;overflow-wrap:anywhere}
.hero .sub{font-size:1.02rem;font-weight:600;margin:18px 0 0;color:var(--ink)}
.hero .lede{font-family:var(--serif);font-size:1.17rem;line-height:1.6;color:var(--muted);max-width:52ch;margin:10px 0 0}
.desk{background:var(--surface);border:1px solid var(--rule);border-radius:6px}
.desk h2{font-size:.95rem;font-weight:600;padding:14px 18px;border-bottom:1px solid var(--rule)}
.desk ul{list-style:none;margin:0;padding:0}
.desk li{padding:13px 18px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.desk li:last-child{border-bottom:0}
.desk .nm{font-weight:600;color:var(--ink);text-decoration:none}
.desk .nm:hover{color:var(--accent)}
.desk .meta{font-size:.82rem;color:var(--muted);grid-column:1 / -1}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:32px}}

.log{list-style:none;margin:0;padding:0;max-width:760px}
.log li{display:grid;grid-template-columns:108px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--rule)}
.log time{font-size:.86rem;color:var(--muted);padding-top:2px}
.log .what{font-family:var(--serif);font-size:1.03rem;line-height:1.5}
.log .who{font-family:var(--sans);font-size:.84rem;font-weight:600;margin-right:6px}
@media (max-width:560px){.log li{grid-template-columns:1fr;gap:2px}}

/* ---------- company ---------- */
.co-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 32px;align-items:flex-end}
.co-head .meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.9rem;color:var(--muted);margin-top:12px}
.co-head .meta b{color:var(--ink);font-weight:600}
.keyfig{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin:28px 0 0;background:var(--surface);border:1px solid var(--rule);border-radius:6px}
.keyfig div{padding:14px 16px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.keyfig dt{font-size:.78rem;color:var(--muted)}
.keyfig dd{margin:4px 0 0;font-size:1.25rem;font-weight:600;letter-spacing:-.01em}
.toc{display:flex;flex-wrap:wrap;gap:4px 18px;margin:22px 0 0;font-size:.88rem;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.toc span{color:var(--muted)}
.toc button{background:none;border:0;padding:2px 0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px}
.pointlist{margin:0;padding:0;list-style:none}
.pointlist li{padding:10px 0 10px 18px;border-bottom:1px solid var(--rule);position:relative;font-family:var(--serif);font-size:1.03rem;line-height:1.55}
.pointlist li::before{content:"";position:absolute;left:0;top:19px;width:7px;height:2px;background:var(--faint)}
.case{padding:18px 20px;border-radius:6px;background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--accent)}
.case.bear{border-top-color:var(--neg)}
.case h3{font-family:var(--serif);font-size:1.2rem;margin-bottom:8px}
.case p{font-family:var(--serif);font-size:1.03rem;line-height:1.62;margin:0}
.thesis{border-left:3px solid var(--accent);padding:4px 0 4px 22px}
.empty{padding:16px 18px;border:1px dashed var(--rule);border-radius:6px;color:var(--muted);font-size:.92rem;background:transparent}
.formula{font-size:.84rem;color:var(--muted);margin-top:8px}

/* ---------- other pages ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;background:var(--surface);border:1px solid var(--rule);border-radius:6px;margin-top:28px}
.stats div{padding:18px 20px;border-right:1px solid var(--rule)}
.stats div:last-child{border-right:0}
.stats dt{font-size:.82rem;color:var(--muted)}
.stats dd{margin:6px 0 0;font-family:var(--serif);font-size:2.3rem;line-height:1}
@media (max-width:700px){.stats div{border-right:0;border-bottom:1px solid var(--rule)}}
.stack{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--rule);margin:8px 0 10px}
.stack span{display:block;height:100%}
.steps{list-style:none;counter-reset:s;margin:30px 0 0;padding:0;max-width:820px}
.steps li{counter-increment:s;display:grid;grid-template-columns:56px 1fr;gap:6px 18px;padding:22px 0;border-top:1px solid var(--rule)}
.steps li::before{content:counter(s);font-family:var(--serif);font-size:2rem;line-height:1;color:var(--accent);grid-row:span 3}
.steps h3{font-family:var(--serif);font-size:1.3rem}
.steps p{margin:4px 0 0;font-family:var(--serif);font-size:1.04rem;line-height:1.6;color:var(--ink);max-width:64ch}
.steps .looks{font-family:var(--sans);font-size:.86rem;color:var(--muted)}
.wl{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.wl article{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px}
.wl h3{font-family:var(--serif);font-size:1.25rem}
.wl ol{margin:8px 0 0;padding-left:20px;font-size:.92rem;line-height:1.55}
.src-list{list-style:none;padding:0;margin:0;max-width:820px}
.src-list li{padding:16px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:6px 24px}
.src-list .k{font-size:.8rem;color:var(--muted)}
.src-list p{margin:0;font-size:.94rem;line-height:1.55}
@media (max-width:640px){.src-list li{grid-template-columns:1fr}}

/* ---------- manage & editor ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:2px 6px;border-bottom:1px solid var(--rule);margin:26px 0 24px}
.tabs a{padding:9px 12px;text-decoration:none;color:var(--muted);font-size:.94rem;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.fs{margin-top:44px;scroll-margin-top:20px}
.fs > h2{font-family:var(--serif);font-size:1.4rem;line-height:1.2;margin:0 0 6px}
.fs-intro{font-size:.92rem;color:var(--muted);margin:0 0 16px;max-width:72ch;line-height:1.5}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px 20px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1 / -1}
.fld label,.lbl{font-size:.86rem;font-weight:600}
.opt{font-weight:400;color:var(--muted)}
.hint{font-size:.8rem;color:var(--muted);margin:0;line-height:1.4}
.hint:empty,.err:empty{display:none}
.err{font-size:.82rem;color:var(--neg);margin:0;font-weight:600}
.echo.warn{color:var(--flag);font-weight:600}
.echo.bad{color:var(--neg);font-weight:600}
input[type=text],input[type=date],input[type=url],input[type=search],input:not([type]),textarea{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;font-size:.95rem;width:100%;min-width:0}
textarea{min-height:104px;resize:vertical;line-height:1.55;font-family:var(--serif);font-size:1.02rem}
textarea.code{font-family:var(--mono);font-size:.82rem;line-height:1.5;min-height:220px;white-space:pre;overflow:auto}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
[aria-invalid="true"]{border-color:var(--neg)!important;background:var(--neg-bg)!important}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;margin-top:16px;max-width:72ch}
.check input{margin-top:4px;accent-color:var(--accent);flex:none}
.check .hint{margin-top:2px}
.grid-tbl th,.grid-tbl td{padding:6px 8px;vertical-align:middle}
.grid-tbl thead th{padding:8px}
.grid-tbl input{min-width:96px;text-align:right;padding:7px 8px;font-size:.92rem}
.grid-tbl input.l{text-align:left;min-width:130px}
.grid-tbl input.tk{text-align:left;min-width:74px;max-width:96px}
.grid-tbl thead input{font-weight:600;color:var(--ink);background:var(--surface)}
.yr{display:flex;gap:4px;align-items:center}
.rm{background:none;border:1px solid transparent;border-radius:3px;color:var(--muted);cursor:pointer;padding:2px 6px;font-size:1rem;line-height:1}
.rm:hover{color:var(--neg);border-color:var(--rule)}
.grid-foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:10px}
.echo{font-size:.84rem;color:var(--muted);margin:0;min-height:1.3em}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin:0;border:1px solid var(--rule);border-radius:6px;background:var(--sunk);overflow:hidden}
.calc div{padding:10px 14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0 -1px -1px 0}
.calc dt{font-size:.76rem;color:var(--muted)}
.calc dd{margin:2px 0 0;font-weight:600}
.calc .why{display:block;font-weight:400;font-size:.76rem;color:var(--muted);margin-top:2px}
details.helper{margin-top:16px;border:1px solid var(--rule);border-radius:6px;padding:10px 14px;background:var(--surface)}
details.helper summary{cursor:pointer;font-size:.9rem;font-weight:600;color:var(--accent)}
details.helper[open] summary{margin-bottom:12px}
.wcard{border:1px solid var(--rule);border-radius:6px;background:var(--surface);padding:16px 18px 18px;margin:16px 0 0;min-width:0}
.wcard legend{font-family:var(--serif);font-size:1.15rem;padding:0 6px;margin-left:-6px}
.hist{list-style:none;margin:8px 0 0;padding:0;max-width:760px}
.hist li{display:grid;grid-template-columns:110px 1fr auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:.92rem;align-items:baseline}
.hist time{color:var(--muted);font-size:.86rem}
.savebar{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:5;margin-top:44px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.savebar .state{font-size:.9rem;color:var(--muted);flex:1 1 280px;min-width:0}
.savebar .state b{color:var(--ink)}
.savebar .state.bad{color:var(--neg)}
.savebar .state ul{margin:4px 0 0;padding-left:18px}
.savebar .btns{margin:0}
.inline-confirm{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center}
.manage-tbl td{vertical-align:middle}
.actions{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:flex-end;white-space:nowrap}

.grid-tbl tbody th{white-space:nowrap;position:sticky;left:0;z-index:1;background:var(--surface)}
.grid-tbl thead th:first-child{position:sticky;left:0;z-index:2}
.calc{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){

  .savebar .btns{flex-wrap:nowrap;width:100%}
  .savebar .btn{flex:1;padding:9px 8px;font-size:.86rem;text-align:center;white-space:nowrap}
  .hist li{grid-template-columns:1fr auto}

}
@media (max-width:900px){.fs{scroll-margin-top:76px}}

/* ---------- research report structure ---------- */
.legal{font-family:var(--serif);font-size:1.12rem;color:var(--muted);margin:8px 0 0}
.co-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.rmeta{display:grid;grid-template-columns:180px repeat(auto-fit,minmax(120px,1fr));margin:24px 0 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.rmeta div{padding:12px 16px 12px 0}
.rmeta dt{font-size:.76rem;color:var(--muted)}
.rmeta dd{margin:4px 0 0;font-weight:600;font-size:.95rem}
.badge{display:inline-flex;align-items:center;padding:3px 10px 3px 8px;border:1px solid var(--rule);border-radius:999px;background:var(--surface);font-weight:600}
.badge.pub{border-color:var(--accent)}
.timeline{list-style:none;margin:26px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative}
.timeline::before{content:"";position:absolute;left:7px;right:calc(20% - 7px);top:7px;height:2px;background:var(--rule)}
.timeline li{position:relative;padding:24px 12px 0 0}
.timeline li::before{content:"";position:absolute;left:0;top:0;width:16px;height:16px;border-radius:50%;background:var(--paper);border:2px solid var(--faint);box-sizing:border-box}
.timeline li.done::before{background:var(--accent);border-color:var(--accent)}
.t-label{display:block;font-size:.8rem;color:var(--muted);line-height:1.3}
.t-date{display:block;font-weight:600;font-size:.92rem;margin-top:3px}
.t-none{display:block;font-size:.9rem;color:var(--faint);margin-top:3px}
@media (max-width:700px){
  .rmeta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .timeline{grid-template-columns:1fr}

  .timeline li{padding:0 0 14px 28px}
}
.disclaimer{margin:22px 0 0;padding:10px 14px;border:1px solid var(--rule);border-radius:4px;font-size:.84rem;color:var(--muted);background:var(--surface);max-width:80ch}

.cite{display:block}

.ref{font-weight:600;text-decoration:none;font-size:.86em}

.peer-tbl th.self,.peer-tbl td.self{background:var(--accent-soft)}
.src-row td,.src-row th{font-size:.84rem}
.src-table td:first-child{white-space:nowrap;color:var(--muted)}

@media (max-width:900px){.part{scroll-margin-top:76px}}

.peer-tbl thead th{white-space:normal}
.peer-tbl .src-row td{white-space:normal;min-width:120px}
@media (max-width:640px){

.wcard .cite-row{border-top:0;padding-top:6px;margin-top:6px}
.cite-acts{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px 20px;font-size:.86rem}

/* EQUITYLENS_APP_V3

"use strict";

const CO_STATUSES = ["Researching", "Draft Complete", "Published"];

  "Watchlist": "Identified, not yet started",
  "Researching": "Reading reports and building the financial review",
  "Draft Complete": "Full draft written, still checking evidence",
  "Published": "Complete and maintained"
};
/* Annual figures, one value per fiscal year */
const FIN = [
  { k: "revenue", label: "Revenue" },
  { k: "operatingIncome", label: "Operating income" },
  { k: "netIncome", label: "Net income" },
  { k: "ebitda", label: "EBITDA" },
  { k: "freeCashFlow", label: "Free cash flow" }
];
/* Point-in-time figures */
const POINT = [
  { k: "totalDebt", label: "Total debt" },
  { k: "cash", label: "Cash and equivalents" },
  { k: "equity", label: "Shareholders' equity" },
  { k: "marketCap", label: "Market capitalization" }
];
/* Every figure that can carry a source */
const FIGS = FIN.concat(POINT);
const CURRENCIES = { USD: "$", EUR: "€", GBP: "£", JPY: "¥", CHF: "CHF ", CAD: "C$", AUD: "A$", CNY: "CN¥", HKD: "HK$", KRW: "₩", INR: "₹", SEK: "SEK ", NOK: "NOK ", DKK: "DKK " };
const SOURCE_TYPES = ["Annual report", "Quarterly report", "Earnings release", "SEC filing", "Investor presentation", "Investor relations", "Market data", "Regulatory filing", "Secondary data"];
const JOURNAL_TYPES = ["Read annual report", "Reviewed earnings call", "Updated valuation", "Changed thesis", "Compared competitor metrics", "Other note"];
const NM = "nm";
const STALE_DAYS = 90;

const DRAFT_PREFIX = "equitylens:draft:";

/* ===================== small helpers ===================== */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isNum = v => typeof v === "number" && isFinite(v);

const pad = n => String(n).padStart(2, "0");

const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(str(s));
const fmtDate = d => {
  if (!d) return "—";
  if (!isDate(d)) return esc(d);
  const [y, m, dd] = d.split("-").map(Number);
  return new Date(y, m - 1, dd).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
};
const fmtMonth = d => { const [y, m] = d.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("en-US", { year: "numeric", month: "long" }); };
const daysSince = d => (isDate(d) ? Math.floor((Date.now() - new Date(d + "T00:00:00").getTime()) / 864e5) : null);
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

const sleep = ms => new Promise(r => setTimeout(r, ms));
const nextVersion = (v, major) => {
  const m = str(v).match(/^(\d+)\.(\d+)$/), a = m ? +m[1] : 0, b = m ? +m[2] : 0;

const sym = cur => (CURRENCIES[cur] != null ? CURRENCIES[cur] : cur ? cur + " " : "$");
const unitsOf = c => `${(c && c.currency) || "USD"} millions`;
const money = (v, cur = "USD") => {

    .replace(/^(-?)(usd|eur|gbp|jpy|chf|cad|aud|cny|hkd|krw|inr|sek|nok|dkk)/i, "$1")

function checkImport(raw) {

  const seen = new Set();
  (Array.isArray(raw.companies) ? raw.companies : []).forEach((c, i) => {
    const who = c && (c.ticker || c.name) ? (c.ticker || c.name) : `Company ${i + 1}`;
    if (!c || typeof c !== "object") { errors.push(`${who} isn't an object.`); return; }

    if (!tk) errors.push(`${who} has no ticker.`);

  const vals = items.map(d => d.value).filter(isNum);
  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals) || 1;
  const x = v => L + (v - lo) / (hi - lo || 1) * (W - L - R);
  let g = `<line class="zero" x1="${x(0)}" x2="${x(0)}" y1="0" y2="${H - 6}"/>`;
  items.forEach((d, i) => {
    const yy = i * rowH + 6;
    g += `<text x="${L - 10}" y="${yy + 17}" text-anchor="end" style="${d.self ? "font-weight:600;fill:var(--ink)" : ""}">${esc(d.label)}</text>`;
    if (isNum(d.value)) {
      const x0 = Math.min(x(0), x(d.value)), w = Math.max(1, Math.abs(x(d.value) - x(0)));
      g += `<rect x="${x0}" y="${yy + 5}" width="${w}" height="18" rx="1.5" fill="${d.value < 0 ? "var(--neg)" : d.self ? "var(--accent)" : "var(--series2)"}"/>`;
      g += `<text x="${Math.max(x(d.value), x(0)) + 6}" y="${yy + 18}">${fmt(d.value)}</text>`;
    } else {
      g += `<text x="${x(0) + 6}" y="${yy + 18}">${d.value === NM ? "not meaningful" : "not entered"}</text>`;
    }
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg></div>`;
}

function keyFiguresTable(c, reg) {

function calcRows(c, m) {
  const y = m.year ? esc(m.year) : "the latest year", py = m.prevYear ? esc(m.prevYear) : "the year before", cur = c.currency;
  const why = (v, need, nm) => (v === NM ? nm || "Not meaningful" : v == null ? need : "");
  return [
    ["Revenue growth", neg(m.revenueGrowth, pct(m.revenueGrowth)), `Revenue ${y} ÷ revenue ${py} − 1`, why(m.revenueGrowth, "Needs revenue for two consecutive years")],
    ["Compound revenue growth", neg(m.revenueCagr, pct(m.revenueCagr)), m.cagrFrom ? `Average yearly growth, ${esc(m.cagrFrom)} to ${y}` : "Average yearly growth across the years entered", why(m.revenueCagr, "Needs revenue for two or more years")],
    ["Operating margin", neg(m.operatingMargin, pct(m.operatingMargin)), `Operating income ÷ revenue, ${y}`, why(m.operatingMargin, `Needs operating income and revenue for ${y}`)],
    ["Net margin", neg(m.netMargin, pct(m.netMargin)), `Net income ÷ revenue, ${y}`, why(m.netMargin, `Needs net income and revenue for ${y}`)],
    ["Free cash flow margin", neg(m.fcfMargin, pct(m.fcfMargin)), `Free cash flow ÷ revenue, ${y}`, why(m.fcfMargin, `Needs free cash flow and revenue for ${y}`)],
    [isNum(m.netDebt) && m.netDebt < 0 ? "Net cash" : "Net debt", money(isNum(m.netDebt) ? Math.abs(m.netDebt) : null, cur), "Total debt − cash and equivalents", why(m.netDebt, "Needs total debt and cash")],
    ["Debt to equity", dec2(m.debtToEquity), "Total debt ÷ shareholders' equity", why(m.debtToEquity, "Needs total debt and equity", "Not meaningful: equity is zero or negative")],
    ["Net debt to EBITDA", lev(m.netDebtToEbitda), `Net debt ÷ EBITDA, ${y}`, why(m.netDebtToEbitda, `Needs net debt and EBITDA for ${y}`, "Not meaningful: EBITDA is zero or negative")],
    ["Enterprise value", money(m.ev, cur), "Market cap + total debt − cash", why(m.ev, "Needs market cap, total debt and cash")],
    ["P/E", mult(m.pe), `Market cap ÷ net income, ${y}`, why(m.pe, `Needs market cap and net income for ${y}`, "Not meaningful: net income is zero or negative")],
    ["EV/EBITDA", mult(m.evEbitda), `Enterprise value ÷ EBITDA, ${y}`, why(m.evEbitda, `Needs enterprise value and EBITDA for ${y}`, "Not meaningful: EBITDA is zero or negative")]
  ];
}

const cmpFmt = (r, v, cur) => (r.money ? money(v, cur) : r.f(v));

function compare() {
  if (!cmpSel) cmpSel = new Set([...COS()].sort((a, b) => b.updated.localeCompare(a.updated)).slice(0, 4).map(c => c.id));
  return `<div class="page">

    </div>` : ""}
    <div id="cmpOut"></div>
    ${footer()}</div>`;

function compareRender() {
  const list = COS().filter(c => cmpSel.has(c.id));
  const out = document.getElementById("cmpOut");
  if (list.length < 2) {
    out.innerHTML = `<div class="empty" style="margin-top:20px">${COS().length < 2 ? "Comparisons appear once at least two companies are covered. Each report's own page compares the company with its competitors." : "Select at least two companies to compare."}</div>`;
    return;
  }
  const ms = list.map(metrics), anyPh = list.some(c => c.placeholder), mixed = new Set(list.map(c => c.currency)).size > 1;
  const rows = CMP.map(r => {
    const vals = ms.map(m => m[r.k]), nums = vals.filter(isNum), maxAbs = Math.max(...nums.map(Math.abs), 0) || 1;
    return `<tr><th>${r.label}</th>${vals.map((v, i) => `<td class="num">${notEntered(r.neutral ? cmpFmt(r, v, list[i].currency) : neg(v, cmpFmt(r, v, list[i].currency)))}${isNum(v) && !(r.money && mixed) ? `<span class="cmp-bar" aria-hidden="true"><span class="${v < 0 && !r.neutral ? "n" : ""}" style="width:${Math.abs(v) / maxAbs * 100}%"></span></span>` : ""}</td>`).join("")}</tr>`;
  }).join("");
  const cur = CMP.find(r => r.k === cmpMetric);
  const chartOk = !(cur.money && mixed);
  out.innerHTML = `
    <div class="panel" style="margin-top:24px"><div class="panel-head"><h3>
      <label>Chart <select id="cmpMetric" aria-label="Measure to chart">${CMP.map(r => `<option value="${r.k}" ${r.k === cmpMetric ? "selected" : ""}>${r.label}</option>`).join("")}</select></label></h3>${ph(anyPh)}</div>
      ${chartOk ? hbarChart({ items: list.map((c, i) => ({ label: c.ticker, value: ms[i][cmpMetric], self: true })), fmt: v => cmpFmt(cur, v, list[0].currency), label: `${cur.label} by company`, W: 800 })
        : `<div class="chart-empty">These companies report in different currencies, so amounts aren't charted against each other. Ratios and percentages can be compared.</div>`}
    </div>
    <div class="tbl-wrap" style="margin-top:16px"><table>
      <thead><tr><th>Measure</th>${list.map(c => `<th class="num"><a class="row-link" href="#/company/${esc(c.id)}">${esc(c.ticker)}</a></th>`).join("")}</tr></thead>
      <tbody><tr><th>Industry</th>${list.map(c => `<td class="num">${esc(c.industry)}</td>`).join("")}</tr><tr><th>Reporting currency</th>${list.map(c => `<td class="num">${esc(c.currency)}</td>`).join("")}</tr>${rows}</tbody>
    </table></div>
    <p class="small" style="margin-top:10px">${anyPh ? ph(true) + " Includes illustrative figures. " : ""}${mixed ? "Amounts are in each company's reporting currency and aren't converted. " : ""}Bars show size relative to the largest value in each row, not whether a figure is good or bad. A dash means not entered; n/m means not meaningful.</p>`;
  document.getElementById("cmpMetric").addEventListener("change", e => { cmpMetric = e.target.value; compareRender(); });
}
function compareMount() {

const METHOD = [
  ["Understand the company and its business model", "Before looking at any numbers, I write a plain explanation of what the company sells, who pays for it, and why customers choose it over alternatives. If I can't explain it simply, I'm not ready to judge its financials.", "Sources: the business section of the annual report, investor presentations"],
  ["Review financial statements", "I read the income statement, balance sheet and cash flow statement together for at least five years, along with the notes that explain unusual items. Every figure I record keeps its source, the period it covers and the date I accessed it.", "Sources: annual and quarterly reports (10-K and 10-Q filings for U.S. companies)"],
  ["Analyze revenue and profitability trends", "I look at how fast revenue is growing, whether margins are expanding or shrinking, and whether profit turns into actual cash. When net income and free cash flow diverge, I find out why.", "Measures: revenue growth, operating and net margin, free cash flow"],
  ["Examine valuation metrics", "I calculate what the market is paying for the business relative to its earnings and cash flow, and show the formula so each figure can be checked.", "Measures: P/E, enterprise value, EV/EBITDA"],
  ["Compare the company with competitors", "A margin or multiple only means something next to similar companies. I pick peers that sell to the same customers, not just companies in the same broad sector, and record where their figures come from.", "Output: competitor comparison with sources"],

/* Saves `next` as the new live version of the site. In claude.ai the page publishes itself;
   elsewhere the change applies to this tab and can be downloaded as a new site file. */
async function publishData(next, opts) {
  next = normalizeData(next);
  next.meta.lastSaveId = rid();
  next.meta.lastSaved = new Date().toISOString();
  const mode = editAccess();
  if (mode === "offline") {
    DATA = next;
    if (opts.draftKey) store.del(DRAFT_PREFIX + opts.draftKey);
    ED = null;
    FLASH = { kind: "warn", msg: "Change applied in this copy only. To keep it, download the updated site file from Manage site, Data file." };
    goTo(opts.returnTo);
    return;
  }
  if (mode !== "publish") { setSave("readonly"); return; }
  let html;
  try { html = buildHtml(next); }
  catch (e) { setSave("error", "Couldn't prepare the page for saving (" + (e.message || e) + "). Nothing was changed."); return; }
  if (ED) saveDraftNow();
  store.set(SAVE_KEY, { token: next.meta.lastSaveId, ts: Date.now(), returnTo: opts.returnTo, okMsg: opts.okMsg, draftKey: opts.draftKey || null, editRoute: opts.editRoute || null });
  setSave("saving");
  try {
    await CAP.art.publish(html);
    setSave("saved");
    setTimeout(() => {
      /* The viewer normally reloads to the new version by now. If it hasn't, show the saved data here. */
      if (SAVE.state !== "saved") return;
      store.del(SAVE_KEY);
      if (opts.draftKey) store.del(DRAFT_PREFIX + opts.draftKey);
      DATA = next; ED = null; SAVE = { state: "idle", msg: "" };
      FLASH = { kind: "", msg: opts.okMsg };
      goTo(opts.returnTo);
    }, 5000);
  } catch (e) {
    const code = e && e.code;
    if (code === "conflict") { setSave("conflict"); return; }
    store.del(SAVE_KEY);
    if (code === "upstream_error" && !opts.retried) {
      await sleep(700 + Math.random() * 900);
      return publishData(next, Object.assign({}, opts, { retried: true }));
    }
    if (["not_writer", "not_granted", "consent_required", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
      CAP.readOnly = true; setSave("readonly"); return;
    }
    if (code === "too_large") setSave("error", "The site file is too large to save. Shorten some text or remove unused entries, then save again.");
    else if (code === "rate_limited") setSave("error", "Saving too often. Wait a minute, then save again. Your changes are still here.");
    else if (code === "invalid_content" || code === "transform_error") setSave("error", "The saved page was rejected. Nothing was changed. Download a data backup from Manage site, Data file, before trying again.");
    else setSave("error", "Couldn't save right now. Your changes are still here; try saving again.");
  }
}

/* Changes the address without triggering a second render. */
function setHashQuietly(h) {
  try { history.replaceState(null, "", h); } catch (e) { location.replace(h); }
}
/* After a reload: did the last save land? */
(function checkLastSave() {
  const st = store.get(SAVE_KEY);
  if (!st) return;
  store.del(SAVE_KEY);
  if (Date.now() - st.ts > 15 * 60 * 1000) return;
  if (DATA.meta.lastSaveId === st.token) {
    if (st.draftKey) store.del(DRAFT_PREFIX + st.draftKey);
    FLASH = { kind: "", msg: st.okMsg };
    if (st.returnTo && st.returnTo !== location.hash) setHashQuietly(st.returnTo);
  } else if (st.draftKey && st.editRoute) {
    FAILED_DRAFT_KEY = st.draftKey;
    FLASH = { kind: "warn", msg: "Your last save didn't go through because the site changed in the meantime. Your edits are restored below; check them and save again." };
    if (st.editRoute !== location.hash) setHashQuietly(st.editRoute);
  } else {
    FLASH = { kind: "warn", msg: "Your last change wasn't saved because the site changed in the meantime. Please make it again." };
  }
})();

    const t = str(y).trim();
    if (!t) add(`years.${i}`, `Year column ${i + 1} needs a label, like FY2025.`);
    else if (seen.has(t)) add(`years.${i}`, `${t} appears twice in the year columns.`);
    seen.add(t);
  });
  Object.keys(ED.bad).forEach(p => add(p, `${pathLabel(p)}: “${ED.bad[p]}” isn't a number.`));
  FIGS.forEach(f => d.figureSources[f.k].forEach((ci, i) => checkCite(`figureSources.${f.k}.${i}`, ci, `${f.label} source ${i + 1}`)));
  d.peers.forEach((p, i) => {
    const any = str(p.ticker).trim() || ["revenueGrowth", "operatingMargin", "netMargin", "fcf", "pe", "evEbitda", "debt"].some(k => isNum(p[k])) || !citeEmpty(p.source);
    if (any && !str(p.name).trim()) add(`peers.${i}.name`, `Competitor ${i + 1} needs a name.`);
    checkCite(`peers.${i}.source`, p.source, `Competitor ${i + 1} source`);
  });
  d.sources.forEach((s, i) => {
    const u = str(s.url).trim();
    if (u && !safeUrl(u)) add(`sources.${i}.url`, `Document ${i + 1}: links must start with https:// or http://.`);
    if ((u || s.type || s.accessed) && !str(s.label).trim()) add(`sources.${i}.label`, `Document ${i + 1} needs a name.`);
    if (s.accessed && !isDate(s.accessed)) add(`sources.${i}.accessed`, `Document ${i + 1}: enter a full date.`);
  });
  return errs;
}
function finalizeCompany() {
  const d = clone(ED.draft), t = today(), prev = prevSaved(), prevStatus = prev ? prev.status : null;
  const trimCite = ci => ({ name: str(ci.name).trim(), url: str(ci.url).trim(), period: str(ci.period).trim(), accessed: str(ci.accessed).trim() });
  d.ticker = str(d.ticker).trim().toUpperCase();
  ["name", "legalName", "industry", "reportTitle", "bull", "bear", "valuation", "thesis", "conclusion"].forEach(k => { d[k] = str(d[k]).trim(); });
  d.years = d.years.map(y => str(y).trim());
  FIGS.forEach(f => { d.figureSources[f.k] = d.figureSources[f.k].map(trimCite).filter(ci => !citeEmpty(ci)); });
  d.peers = d.peers.map(p => Object.assign({}, p, { name: str(p.name).trim(), ticker: str(p.ticker).trim().toUpperCase(), source: trimCite(p.source) }))
    .filter(p => p.name || p.ticker || ["revenueGrowth", "operatingMargin", "netMargin", "fcf", "pe", "evEbitda", "debt"].some(k => isNum(p[k])) || !citeEmpty(p.source));
  d.sources = d.sources.map(s => ({ label: str(s.label).trim(), type: str(s.type).trim(), url: str(s.url).trim(), accessed: str(s.accessed).trim() })).filter(s => s.label || s.url);
  if (!d.created) d.created = t;
  /* The timeline records when each stage was first reached */
  if ((d.status === "Draft Complete" || d.status === "Published") && d.status !== prevStatus && !d.timeline.firstDraft) d.timeline.firstDraft = t;
  if (d.status === "Published" && prevStatus !== "Published" && !d.timeline.published) d.timeline.published = t;
  if (ED.earnings) d.timeline.earningsUpdate = t;
  if (ED.isNew || ED.updateDate || !d.updated) d.updated = t;
  if (ED.isNew) d.version = "0.1";
  else if (ED.bumpVersion) d.version = nextVersion(str(d.version).trim(), d.status === "Published" && prevStatus !== "Published");
  else d.version = str(d.version).trim();
  const note = str(ED.note).trim();
  if (note) d.updates.unshift({ date: t, note, version: d.version });
  else if (ED.isNew) d.updates.unshift({ date: t, note: ED.fromWatch != null ? "Moved from the watchlist and started coverage." : "Started coverage.", version: d.version });
  else if (ED.bumpVersion) d.updates.unshift({ date: t, note: "Report updated.", version: d.version });
  return normCompany(d);
}
function saveCompany() {
  const errs = validateCompany();
  showErrors(errs);
  if (errs.length) { const el = document.getElementById(errs[0].id); if (el) el.focus(); return; }
  const c = finalizeCompany(), next = clone(DATA);
  const i = ED.isNew ? -1 : next.companies.findIndex(x => x.id === ED.origId);

  if (!ED.isNew && c.id !== ED.origId) next.journal.forEach(e => { if (e.company === ED.origId) e.company = c.id; });

}

  },
  removeCite(b) { ED.draft.figureSources[b.dataset.k].splice(+b.dataset.i, 1); rerender("sec-fsrc", figSourcesHtml); afterChange(); },
  applyCite(b) {
    const src = ED.draft.figureSources[b.dataset.k][+b.dataset.i];

  },
  addPeer() {

    const el = document.getElementById(fid(`peers.${ED.draft.peers.length - 1}.name`)); if (el) el.focus();
  },
  removePeer(b) { const i = +b.dataset.i; ED.draft.peers.splice(i, 1); shiftAll("peers.", i, -1); rerender("sec-peers", peersHtml); afterChange(); },
  addDoc() {

  },
  removeDoc(b) { ED.draft.sources.splice(+b.dataset.i, 1); rerender("sec-docs", docsRows); afterChange(); },
  removeUpdate(b) { ED.draft.updates.splice(+b.dataset.i, 1); rerender("sec-history", historyRows); afterChange(); },
  mcUse() {

  },
  addJournal() {

    rerender("sec-journal", journalCards); afterChange();
    const el = document.getElementById(fid("0.note")); if (el) el.focus();
  },
  removeJournal(b) { const i = +b.dataset.i; ED.draft.splice(i, 1); shiftAll("", i, -1); rerender("sec-journal", journalCards); afterChange(); },
  addWatch() {
    ED.draft.unshift(normWatch({ added: today() }));
    shiftAll("", 0, 1);
    rerender("sec-watch", watchCards); afterChange();
    const el = document.getElementById(fid("0.name")); if (el) el.focus();
  },
  removeWatch(b) { const i = +b.dataset.i; ED.draft.splice(i, 1); shiftAll("", i, -1); rerender("sec-watch", watchCards); afterChange(); },
  startCoverage(b) { if (ED && ED.dirty) return; ED = null; goTo("#/manage/new/" + b.dataset.i); },
  addGenSource() { ED.draft.sources.push(normSource({})); rerender("sec-gsrc", genSourceRows); afterChange(); },
  removeGenSource(b) { const i = +b.dataset.i; ED.draft.sources.splice(i, 1); shiftAll("sources.", i, -1); rerender("sec-gsrc", genSourceRows); afterChange(); },
  save() {
    if (!ED || SAVE.state === "saving") return;
    SAVE = { state: "idle", msg: "" };

  },
  discard() { ED.confirm = "discard"; updateSavebar(); },
  discardNo() { ED.confirm = null; updateSavebar(); },
  discardYes() {
    store.del(DRAFT_PREFIX + ED.key);
    const keep = { isNew: ED.isNew, origId: ED.origId, fromWatch: ED.fromWatch, watchName: ED.watchName, live: ED.live, compare: ED.compare, returnTo: ED.returnTo };
    ED = Object.assign({ kind: ED.kind, key: ED.key, draft: JSON.parse(ED.base), base: ED.base, bad: {}, raw: {}, warnDot: {}, note: "", updateDate: true, bumpVersion: true, earnings: false, dirty: false, errors: [], confirm: null, leaveTo: null, restoreOffer: null }, keep);
    SAVE = { state: "idle", msg: "" };
    render();
  },
  leaveStay() { ED.leaveTo = null; updateSavebar(); },
  leaveGo() { const to = ED.leaveTo; store.del(DRAFT_PREFIX + ED.key); ED = null; goTo(to); },
  restoreDraft() { applyDraft(ED.restoreOffer); ED.dirty = computeDirty(); render(); },
  dropDraft() { store.del(DRAFT_PREFIX + ED.key); ED.restoreOffer = null; const n = document.getElementById("restoreNote"); if (n) n.remove(); },
  focusErr(b) { const el = document.getElementById(b.dataset.id); if (el) { el.scrollIntoView({ block: "center" }); el.focus(); } },
  askDelete(b) { PENDING = { type: "delete", id: b.dataset.id }; render(); },
  askRemoveSamples() { PENDING = { type: "samples" }; render(); },
  cancelPending() { PENDING = null; render(); },
  doDelete(b) {
    const c = byId(b.dataset.id); if (!c) return;
    const next = clone(DATA); next.companies = next.companies.filter(x => x.id !== c.id);
    PENDING = null;
    publishData(next, { returnTo: "#/manage", okMsg: `Deleted ${c.name} and published the change.` });
  },
  doRemoveSamples() {

    next.companies = next.companies.filter(c => !c.placeholder);
    next.watchlist = next.watchlist.filter(w => !w.placeholder);
    PENDING = null;
    publishData(next, { returnTo: "#/manage", okMsg: "Removed the sample data and published the change." });
  },
  printReport() {
    try { window.print(); } catch (e) { say("rptStatus", "Printing isn't available in this view. Download the report file and print it from your browser."); }
  },
  async dlReport(b) {
    const c = byId(b.dataset.id); if (!c) return;
    const r = await downloadFile(`${fileBase()}-${c.id.replace(/[^a-z0-9]+/g, "-")}-report.html`, reportFileHtml(c), "text/html");
    say("rptStatus", r === "saved" ? "Downloaded the report file. Open it in your browser and print it, choosing Save as PDF." : r === "declined" ? "Download cancelled." : r === "busy" ? "A download prompt is already open." : "Downloads aren't available in this view. Use Print or save as PDF instead.");
  },
  async dlJson() { dataStatus(await downloadFile(fileBase() + "-data.json", dataJson(DATA), "application/json"), "data backup"); },
  async dlHtml() {
    let html; try { html = buildHtml(DATA); } catch (e) { dataStatus("error", "site file"); return; }
    dataStatus(await downloadFile(fileBase() + ".html", html, "text/html"), "site file");
  },
  async copyJson() {
    const ta = document.getElementById("jsonOut"), out = document.getElementById("dataStatus");
    try { await navigator.clipboard.writeText(ta.value); out.textContent = "Copied the data."; return; } catch (e) { /* fall back to selecting */ }
    ta.focus(); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    out.textContent = ok ? "Copied the data." : "The text is selected. Copy it with Ctrl+C or Cmd+C.";
  },
  checkImport() {
    const box = document.getElementById("importResult"), raw = document.getElementById("jsonIn").value.trim();
    IMPORT_PENDING = null;
    if (!raw) { box.innerHTML = `<div class="notice bad">Paste the data first.</div>`; return; }
    let parsed;
    try { parsed = JSON.parse(raw); } catch (e) { box.innerHTML = `<div class="notice bad">This isn't valid JSON: ${esc(e.message)}. Check for a missing comma or quote near that position.</div>`; return; }
    const { errors, warnings } = checkImport(parsed);
    if (errors.length) { box.innerHTML = `<div class="notice bad"><div><b>Fix these before importing:</b><ul>${errors.slice(0, 12).map(e => `<li>${esc(e)}</li>`).join("")}</ul></div></div>`; return; }
    const d = normalizeData(parsed);
    IMPORT_PENDING = d;
    box.innerHTML = `<div class="notice ${warnings.length ? "warn" : ""}"><div><b>Ready to import:</b> ${plural(d.companies.length, "company", "companies")}, ${plural(d.journal.length, "journal entry", "journal entries")}, ${plural(d.watchlist.length, "watchlist entry", "watchlist entries")}, ${plural(d.sources.length, "general source")}. This replaces everything currently on the site.${warnings.length ? `<ul>${warnings.slice(0, 8).map(w => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}</div>
      <button type="button" class="btn primary small" data-act="doImport" data-save>${editAccess() === "offline" ? "Replace site data" : "Replace site data and publish"}</button></div>`;
  },
  doImport() {

  }
};
const fileBase = () => (S().siteName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "site");
function dataStatus(result, what) {
  say("dataStatus", result === "saved" ? `Downloaded the ${what}.` : result === "declined" ? "Download cancelled." : result === "busy" ? "A download prompt is already open." : result === "error" ? `Couldn't build the ${what}.` : "Downloads aren't available in this view. Use Copy the data instead.");
}
function mcValue() {
  const p = parseNum((document.getElementById("mcPrice") || {}).value, "mult"), s = parseNum((document.getElementById("mcShares") || {}).value, "mult");
  return p.ok && s.ok && isNum(p.v) && isNum(s.v) && p.v > 0 && s.v > 0 ? Math.round(p.v * s.v * 100) / 100 : null;
}
function refreshCurrency() {
  rerender("sec-figures", figuresGrid); rerender("sec-market", marketFields); rerender("sec-peers", peersHtml);
  document.querySelectorAll(".cur-code").forEach(el => { el.textContent = ED.draft.currency; });
}
/* When a source name matches a listed document, fill in its link and access date. */
function autoFillCite(base, name) {
  const doc = ED.draft.sources.find(s => str(s.label).trim().toLowerCase() === str(name).trim().toLowerCase() && str(name).trim());
  if (!doc) return;
  [["url", doc.url], ["accessed", doc.accessed]].forEach(([k, v]) => {
    if (!v || str(getPath(ED.draft, `${base}.${k}`)).trim()) return;
    setPath(ED.draft, `${base}.${k}`, v);
    const el = document.getElementById(fid(`${base}.${k}`)); if (el) el.value = v;
  });
}

/* ===================== editor events (delegated) ===================== */
function edInput(e) {
  const t = e.target, p = t.dataset.p;
  if (!ED || !p) return;
  const ty = t.dataset.t || "text";
  let v;
  if (ty === "check") v = t.checked;
  else if (ty === "money" || ty === "pct" || ty === "mult") {
    const r = parseNum(t.value, ty);
    if (!r.ok) { ED.bad[p] = t.value; delete ED.warnDot[p]; t.setAttribute("aria-invalid", "true"); echoUpdate(t); afterChange(); return; }
    delete ED.bad[p];
    if (ty === "money" && dotThousands(t.value)) ED.warnDot[p] = true; else delete ED.warnDot[p];
    t.removeAttribute("aria-invalid");
    v = r.v;
  } else if (ty === "paras") { ED.raw[p] = t.value; v = t.value.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean); }
  else if (ty === "lines") { ED.raw[p] = t.value; v = t.value.split("\n").map(s => s.trim()).filter(Boolean); }
  else v = t.value;
  if (p[0] === "@") ED[p.slice(1)] = v; else setPath(ED.draft, p, v);
  if (ED.kind === "company") {
    if (p === "updated") { ED.updateDate = false; const cb = document.getElementById(fid("@updateDate")); if (cb) cb.checked = false; }
    if (p === "version") { ED.bumpVersion = false; const cb = document.getElementById(fid("@bumpVersion")); if (cb) cb.checked = false; }
    if (p === "currency") refreshCurrency();
    const mm = p.match(/^(figureSources\.\w+\.\d+|peers\.\d+\.source)\.name$/);
    if (mm) autoFillCite(mm[1], v);
  }
  if (ED.errors.length) {
    const before = ED.errors.length;
    ED.errors = ED.errors.filter(er => er.id !== t.id);
    if (ED.errors.length !== before && ED.bad[p] == null) { t.removeAttribute("aria-invalid"); const er = document.getElementById(t.id + "-err"); if (er) er.textContent = ""; }
  }
  echoUpdate(t);
  afterChange();
}
function echoUpdate(t) {
  const p = t.dataset.p, ty = t.dataset.t;
  const own = document.getElementById(t.id + "-echo");
  if (own) own.innerHTML = echoText(p, ty, t.value);
  if (t.dataset.grid) {
    const g = document.getElementById("gridEcho"), m = p.match(/^financials\.(\w+)\.(\d+)$/);
    if (!g || !m) return;
    const v = getPath(ED.draft, p), label = pathLabel(p);
    if (ED.bad[p] != null) g.innerHTML = `<span class="bad">${esc(label)}: “${esc(ED.bad[p])}” isn't a number.</span>`;
    else if (isNum(v)) g.innerHTML = `${esc(label)} reads as ${money(v, edCur())}.` + (ED.warnDot[p] ? ` <span class="warn">If you meant ${esc(t.value.replace(/\./g, ","))}, type it with commas or no separator.</span>` : Math.abs(v) >= 1e6 ? ` <span class="warn">That's over a trillion; figures are in millions.</span>` : "");
    else g.textContent = `${label}: not entered.`;
  }
}
function gridPaste(e) {
  const t = e.target;
  if (!ED || !t.dataset || !t.dataset.grid) return;
  const text = (e.clipboardData && e.clipboardData.getData("text")) || "";
  if (!/[\t\n]/.test(text.trim())) return;
  e.preventDefault();
  const [r0, c0] = t.dataset.grid.split(",").map(Number);
  const rows = text.replace(/\r/g, "").replace(/\n+$/, "").split("\n").map(r => r.split("\t"));
  let filled = 0, skipped = 0, bad = 0, dots = 0;
  rows.forEach((cells, ri) => cells.forEach((cell, ci) => {
    const r = r0 + ri, c = c0 + ci;
    if (r >= FIN.length || c >= ED.draft.years.length) { if (cell.trim()) skipped++; return; }
    const p = `financials.${FIN[r].k}.${c}`, res = parseNum(cell, "money");
    if (res.ok) { setPath(ED.draft, p, res.v); delete ED.bad[p]; if (dotThousands(cell)) { ED.warnDot[p] = true; dots++; } else delete ED.warnDot[p]; }
    else { ED.bad[p] = cell.trim(); bad++; }
    filled++;
  }));
  rerender("sec-figures", figuresGrid);
  const el = document.querySelector(`[data-grid="${r0},${c0}"]`); if (el) el.focus();
  const g = document.getElementById("gridEcho");
  if (g) g.innerHTML = `Pasted ${plural(filled, "value")}.` + (skipped ? ` ${plural(skipped, "value")} didn't fit in the table and ${skipped === 1 ? "was" : "were"} left out; add year columns first if you need them.` : "")
    + (bad ? ` <span class="bad">${plural(bad, "value")} couldn't be read as numbers and ${bad === 1 ? "is" : "are"} highlighted.</span>` : "")
    + (dots ? ` <span class="warn">${plural(dots, "value")} used dots as thousands separators; check them before saving.</span>` : "");
  afterChange();
}

/* ===================== router ===================== */
const ROUTES = { "": home, research, company, report, journal, compare, dashboard, methodology, reports, watchlist, about, sources };
const MOUNTS = { research: researchMount, compare: compareMount, reports: reportsMount, journal: journalMount };
const TITLES = { research: "Coverage", journal: "Research journal", compare: "Compare", dashboard: "Dashboard", methodology: "Methodology", reports: "Reports", watchlist: "Watchlist", about: "About", sources: "Data sources", manage: "Manage site" };
let main, side, menuBtn, lastHash = location.hash, SKIP_HASH = false;

function routeParts() { return location.hash.replace(/^#\/?/, "").split("/").map(s => { try { return decodeURIComponent(s); } catch (e) { return s; } }); }
function goTo(hash) { if (location.hash === hash) render(); else location.hash = hash; }
function editorKeyFor(parts) {
  if (parts[0] !== "manage") return null;
  if (parts[1] === "company" && parts[2]) return "company:" + parts[2].toLowerCase();
  if (parts[1] === "new") return parts[2] != null && parts[2] !== "" ? "company:new:w" + parts[2] : "company:new";
  if (parts[1] === "journal") return "journal";
  if (parts[1] === "watchlist") return "watchlist";
  if (parts[1] === "settings") return "settings";
  return null;
}
function manageRoute(parts) {
  const gate = manageGate();
  if (gate) { ED = null; return gate; }
  const sub = parts[1] || "";
  if (sub === "company" || sub === "new") {
    const ok = sub === "company" ? openCompanyEditor(str(parts[2]).toLowerCase()) : openCompanyEditor(null, parts[2] != null && parts[2] !== "" ? +parts[2] : null);
    if (!ok) { ED = null; return `<div class="page"><h1 class="page-title">Not found</h1><p class="page-intro">That company or watchlist entry isn't on the site. <a href="#/manage">Back to Manage site</a>.</p></div>`; }
    return companyEditorPage();
  }
  if (sub === "journal") {
    if (parts[2] === "new") { const co = str(parts[3]).toLowerCase(); openJournalEditor(co, co && byId(co) ? "#/company/" + co : "#/journal"); }
    else openJournalEditor();
    return journalEditorPage();
  }
  if (sub === "watchlist") { openWatchEditor(); return watchEditorPage(); }
  if (sub === "settings") { openSettingsEditor(); return settingsEditorPage(); }
  ED = null;
  if (sub === "data") return manageData();
  return manageCompanies();
}
function render() {
  const parts = routeParts(), r = parts[0] || "";
  if (editorKeyFor(parts) !== (ED && ED.key)) { ED = null; SAVE = { state: "idle", msg: "" }; }
  if (r !== "manage") PENDING = null;
  let html;
  if (r === "manage") html = manageRoute(parts);
  else { ED = null; html = (ROUTES[r] || notFound)(parts[1]); }
  /* A message stays up until the person moves to a different page. */
  if (FLASH && FLASH.route == null) FLASH.route = location.hash;
  if (FLASH && FLASH.route !== location.hash) FLASH = null;
  const f = FLASH;
  main.innerHTML = (f ? `<div class="notice ${f.kind || ""}" role="status">${esc(f.msg)}</div>` : "") + html;
  if (MOUNTS[r]) MOUNTS[r](parts[1]);
  if (ED) { if (ED.live) ED.live(); updateSavebar(); }
  else if (SAVE.state !== "idle") setSave(SAVE.state, SAVE.msg);
  const navKey = r === "company" || r === "report" ? "research" : r;
  document.querySelectorAll(".nav a").forEach(a => (a.dataset.r === navKey ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  const co = (r === "company" || r === "report") && byId(parts[1]);
  document.title = co ? `${r === "report" ? reportTitle(co) : `${co.name} (${co.ticker})`} | ${S().siteName}` : TITLES[r] ? `${TITLES[r]} | ${S().siteName}` : `${S().siteName}${S().tagline ? ": " + S().tagline : ""}`;
  side.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false");
  window.scrollTo(0, 0);
}
function onHashChange() {
  if (SKIP_HASH) { SKIP_HASH = false; lastHash = location.hash; return; }
  const parts = routeParts();
  if (ED && ED.dirty && editorKeyFor(parts) !== ED.key && SAVE.state === "idle") {
    ED.leaveTo = location.hash;
    SKIP_HASH = true;
    location.replace(lastHash || "#/");
    updateSavebar();
    const sb = document.getElementById("savebar"); if (sb) sb.scrollIntoView({ block: "nearest" });
    return;
  }
  lastHash = location.hash;
  render();
}

function shellHtml() {
  const s = S();
  return `<div class="shell">
  <aside class="side" id="side">
    <a class="brand" href="#/">${esc(s.siteName)}</a>
    <p class="brand-sub">${esc(s.tagline)}</p>
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav class="nav" id="nav" aria-label="Site">
      <a href="#/" data-r="">Home</a>
      <a href="#/research" data-r="research">Coverage</a>
      <a href="#/reports" data-r="reports">Reports</a>
      <a href="#/journal" data-r="journal">Research journal</a>
      <a href="#/compare" data-r="compare">Compare</a>
      <a href="#/dashboard" data-r="dashboard">Dashboard</a>
      <a href="#/watchlist" data-r="watchlist">Watchlist</a>
      <a href="#/methodology" data-r="methodology" class="group">Methodology</a>
      <a href="#/sources" data-r="sources">Data sources</a>
      <a href="#/about" data-r="about">About the project</a>
      <a href="#/manage" data-r="manage" class="group" id="manageLink" hidden>Manage site</a>
    </nav>

  </aside>
  <main id="main" tabindex="-1"></main>
</div>`;
}

function boot() {
  document.getElementById("app").innerHTML = shellHtml();
  main = document.getElementById("main"); side = document.getElementById("side"); menuBtn = document.getElementById("menuBtn");
  menuBtn.addEventListener("click", () => { const o = side.classList.toggle("open"); menuBtn.setAttribute("aria-expanded", String(o)); });
  main.addEventListener("click", e => {
    const j = e.target.closest("[data-jump]");
    if (j) { e.preventDefault(); const el = document.getElementById(j.dataset.jump); if (el) el.scrollIntoView({ block: "start" }); return; }
    const b = e.target.closest("[data-act]");
    if (b && !b.disabled && ACTIONS[b.dataset.act]) ACTIONS[b.dataset.act](b, e);
  });
  main.addEventListener("input", e => {
    const t = e.target;
    if (t.id === "mcPrice" || t.id === "mcShares") {
      const v = mcValue(), btn = document.getElementById("mcUse");
      say("mcOut", isNum(v) ? `Share price × shares outstanding = ${money(v, edCur())}` : "");
      if (btn) btn.disabled = !isNum(v);
      return;
    }
    if (t.type === "checkbox") return;
    if (t.dataset && t.dataset.p) edInput(e);
  });
  main.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset && t.dataset.p && (t.type === "checkbox" || t.tagName === "SELECT")) edInput(e);
  });
  main.addEventListener("focusin", e => { const t = e.target; if (ED && t.dataset && t.dataset.grid) echoUpdate(t); });
  main.addEventListener("focusout", e => {
    const t = e.target;
    if (!ED || !t.dataset || !t.dataset.p) return;
    const ty = t.dataset.t, p = t.dataset.p;
    if ((ty === "money" || ty === "pct" || ty === "mult") && ED.bad[p] == null && !ED.warnDot[p]) t.value = edVal(p, ty);
    if (p === "ticker" || /\.ticker$/.test(p)) { const up = t.value.trim().toUpperCase(); if (up !== t.value) { t.value = up; edInput({ target: t }); } }
  });
  main.addEventListener("paste", gridPaste);
  window.addEventListener("hashchange", onHashChange);
  render();
  initCaps();
}
boot();
